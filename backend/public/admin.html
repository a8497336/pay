<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>后台管理系统 - 订单管理</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: #f5f7fa;
            color: #333;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px 30px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .header h1 {
            font-size: 24px;
            font-weight: 600;
        }

        .container {
            max-width: 1800px;
            margin: 30px auto;
            padding: 0 20px;
        }

        .tabs {
            background: white;
            border-radius: 8px 8px 0 0;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            display: flex;
            border-bottom: 2px solid #e1e8ed;
            overflow: hidden;
        }

        .tab {
            padding: 18px 30px;
            cursor: pointer;
            font-size: 15px;
            font-weight: 500;
            color: #666;
            background: white;
            border: none;
            transition: all 0.3s;
            position: relative;
        }

        .tab:hover {
            color: #667eea;
            background: #f8f9fa;
        }

        .tab.active {
            color: #667eea;
            background: white;
        }

        .tab.active::after {
            content: '';
            position: absolute;
            bottom: -2px;
            left: 0;
            right: 0;
            height: 2px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .search-bar {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            margin-bottom: 20px;
            display: flex;
            gap: 15px;
            align-items: center;
            flex-wrap: wrap;
        }

        .search-input {
            flex: 1;
            min-width: 200px;
            padding: 12px 16px;
            border: 1px solid #e1e8ed;
            border-radius: 6px;
            font-size: 14px;
            transition: all 0.3s;
        }

        .search-input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .filter-select {
            padding: 12px 16px;
            border: 1px solid #e1e8ed;
            border-radius: 6px;
            font-size: 14px;
            background: white;
            cursor: pointer;
            min-width: 120px;
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover {
            opacity: 0.9;
            transform: translateY(-1px);
        }

        .btn-secondary {
            background: #f5f7fa;
            color: #666;
            border: 1px solid #e1e8ed;
        }

        .btn-secondary:hover {
            background: #e8ecf1;
        }

        .btn-danger {
            background: #dc3545;
            color: white;
        }

        .btn-danger:hover {
            background: #c82333;
            transform: translateY(-1px);
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }

        .stat-card {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }

        .stat-label {
            font-size: 13px;
            color: #999;
            margin-bottom: 8px;
        }

        .stat-value {
            font-size: 28px;
            font-weight: 600;
            color: #333;
        }

        .orders-table {
            background: white;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            overflow: hidden;
        }

        .table-header {
            background: #f8f9fa;
            padding: 15px 20px;
            border-bottom: 1px solid #e1e8ed;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .table-title {
            font-size: 16px;
            font-weight: 600;
            color: #333;
        }

        .table {
            width: 100%;
            border-collapse: collapse;
            table-layout: fixed;
        }

        .table th,
        .table td {
            padding: 15px 20px;
            text-align: left;
            border-bottom: 1px solid #e1e8ed;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .table th:nth-child(1),
        .table td:nth-child(1) {
            width: 15%;
        }

        .table th:nth-child(2),
        .table td:nth-child(2) {
            width: 11%;
        }

        .table th:nth-child(3),
        .table td:nth-child(3) {
            width: 6%;
        }

        .table th:nth-child(4),
        .table td:nth-child(4) {
            width: 5%;
        }

        .table th:nth-child(5),
        .table td:nth-child(5) {
            width: 5%;
        }

        .table th:nth-child(6),
        .table td:nth-child(6) {
            width: 6%;
        }

        .table th:nth-child(7),
        .table td:nth-child(7) {
            width: 6%;
        }

        .table th:nth-child(8),
        .table td:nth-child(8) {
            width: 7%;
        }

        .table th:nth-child(9),
        .table td:nth-child(9) {
            width: 6%;
        }

        .table th:nth-child(10),
        .table td:nth-child(10) {
            width: 13%;
        }

        .table th:nth-child(11),
        .table td:nth-child(11) {
            width: 20%;
        }

        .table th {
            background: #f8f9fa;
            font-weight: 600;
            color: #666;
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .table tbody tr:hover {
            background: #f8f9fa;
        }

        .status-badge {
            display: inline-block;
            padding: 6px 12px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 500;
        }

        .status-pending {
            background: #fff3cd;
            color: #856404;
        }

        .status-completed {
            background: #cce5ff;
            color: #004085;
        }

        .status-processing {
            background: #d1ecf1;
            color: #0c5460;
        }

        .status-success {
            background: #d4edda;
            color: #155724;
        }

        .status-failed {
            background: #f8d7da;
            color: #721c24;
        }

        .payment-method {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .payment-icon {
            font-size: 18px;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #999;
        }

        .empty {
            text-align: center;
            padding: 60px 20px;
            color: #999;
        }

        .empty-icon {
            font-size: 48px;
            margin-bottom: 16px;
            opacity: 0.3;
        }

        .config-form {
            background: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            max-width: 600px;
        }

        .form-group {
            margin-bottom: 24px;
        }

        .form-label {
            display: block;
            font-size: 14px;
            font-weight: 500;
            color: #333;
            margin-bottom: 8px;
        }

        .form-input {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid #e1e8ed;
            border-radius: 6px;
            font-size: 14px;
            transition: all 0.3s;
        }

        .form-input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .form-input[type="number"] {
            font-family: monospace;
        }

        .form-hint {
            font-size: 12px;
            color: #999;
            margin-top: 6px;
        }

        @media (max-width: 768px) {
            .search-bar {
                flex-direction: column;
                align-items: stretch;
            }

            .search-input,
            .filter-select,
            .btn {
                width: 100%;
            }

            .table {
                font-size: 12px;
            }

            .table th,
            .table td {
                padding: 10px;
            }

            .stats {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>后台管理系统 - 订单管理</h1>
    </div>

    <div class="container">
        <div class="tabs">
            <button class="tab active" onclick="switchTab('fast')">快充列表</button>
            <button class="tab" onclick="switchTab('slow')">慢充列表</button>
            <button class="tab" onclick="switchTab('config')">配置</button>
        </div>

        <div id="fastTab" class="tab-content active">
            <div class="stats">
                <div class="stat-card">
                    <div class="stat-label">总订单数</div>
                    <div class="stat-value" id="fastTotalOrders">0</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">待支付</div>
                    <div class="stat-value" id="fastPendingOrders">0</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">已付款</div>
                    <div class="stat-value" id="fastCompletedOrders">0</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">充值中</div>
                    <div class="stat-value" id="fastProcessingOrders">0</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">已完成</div>
                    <div class="stat-value" id="fastSuccessOrders">0</div>
                </div>
            </div>

            <div class="search-bar">
                <input type="text" class="search-input" id="fastSearchInput" placeholder="搜索订单号或户号...">
                <select class="filter-select" id="fastStatusFilter">
                    <option value="">全部状态</option>
                    <option value="pending">待支付</option>
                    <option value="completed">已付款</option>
                    <option value="processing">充值中</option>
                    <option value="success">已完成</option>
                    <option value="failed">充值失败</option>
                </select>
                <button class="btn btn-primary" onclick="searchOrders('fast')">查询</button>
                <button class="btn btn-secondary" onclick="resetSearch('fast')">重置</button>
            </div>

            <div class="orders-table">
                <div class="table-header">
                    <div class="table-title">快充订单列表</div>
                </div>
                <div id="fastOrdersContent">
                    <div class="loading">加载中...</div>
                </div>
            </div>
        </div>

        <div id="slowTab" class="tab-content">
            <div class="stats">
                <div class="stat-card">
                    <div class="stat-label">总订单数</div>
                    <div class="stat-value" id="slowTotalOrders">0</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">待支付</div>
                    <div class="stat-value" id="slowPendingOrders">0</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">已付款</div>
                    <div class="stat-value" id="slowCompletedOrders">0</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">充值中</div>
                    <div class="stat-value" id="slowProcessingOrders">0</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">已完成</div>
                    <div class="stat-value" id="slowSuccessOrders">0</div>
                </div>
            </div>

            <div class="search-bar">
                <input type="text" class="search-input" id="slowSearchInput" placeholder="搜索订单号或户号...">
                <select class="filter-select" id="slowStatusFilter">
                    <option value="">全部状态</option>
                    <option value="pending">待支付</option>
                    <option value="completed">已付款</option>
                    <option value="processing">充值中</option>
                    <option value="success">已完成</option>
                    <option value="failed">充值失败</option>
                </select>
                <button class="btn btn-primary" onclick="searchOrders('slow')">查询</button>
                <button class="btn btn-secondary" onclick="resetSearch('slow')">重置</button>
            </div>

            <div class="orders-table">
                <div class="table-header">
                    <div class="table-title">慢充订单列表</div>
                </div>
                <div id="slowOrdersContent">
                    <div class="loading">加载中...</div>
                </div>
            </div>
        </div>

        <div id="configTab" class="tab-content">
            <div class="config-form">
                <h2 style="font-size: 20px; font-weight: 600; margin-bottom: 24px; color: #333;">折扣配置</h2>
                
                <div class="form-group">
                    <label class="form-label">快充折扣</label>
                    <input type="number" class="form-input" id="fastDiscount" step="0.01" min="0" max="1" placeholder="例如：0.95 表示95折">
                    <div class="form-hint">输入0-1之间的小数，例如：0.95表示95折</div>
                </div>

                <div class="form-group">
                    <label class="form-label">慢充折扣</label>
                    <input type="number" class="form-input" id="slowDiscount" step="0.01" min="0" max="1" placeholder="例如：0.95 表示95折">
                    <div class="form-hint">输入0-1之间的小数，例如：0.95表示95折</div>
                </div>

                <button class="btn btn-primary" onclick="saveConfig()">保存配置</button>
            </div>
        </div>
    </div>

    <script>
        let allOrders = []; 
        let currentTab = 'fast';

        async function loadOrders(type) {
            try {
                const params = new URLSearchParams();
                if (type) {
                    params.append('type', type);
                }
                const url = `/api/orders${params.toString() ? '?' + params.toString() : ''}`;
                const response = await fetch(url);
                const orders = await response.json();
                return orders;
            } catch (error) {
                console.error('加载订单失败:', error);
                return [];
            }
        }

        async function loadAllOrders() {
            try {
                const fastOrders = await loadOrders('fast');
                const slowOrders = await loadOrders('slow');
                allOrders = [...fastOrders, ...slowOrders];
                updateStats('fast');
                updateStats('slow');
                displayOrders('fast', fastOrders);
                displayOrders('slow', slowOrders);
            } catch (error) {
                console.error('加载订单失败:', error);
                document.getElementById('fastOrdersContent').innerHTML = '<div class="empty">加载失败，请刷新页面重试</div>';
                document.getElementById('slowOrdersContent').innerHTML = '<div class="empty">加载失败，请刷新页面重试</div>';
            }
        }

        function switchTab(tab) {
            currentTab = tab;
            
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            
            document.querySelector(`.tab[onclick="switchTab('${tab}')"]`).classList.add('active');
            document.getElementById(`${tab}Tab`).classList.add('active');

            if (tab === 'config') {
                loadConfig();
            }
        }

        function updateStats(type) {
            const orders = type === 'fast' 
                ? allOrders.filter(o => o.type === 'fast')
                : allOrders.filter(o => o.type === 'slow');

            const stats = {
                total: orders.length,
                pending: orders.filter(o => o.status === 'pending').length,
                completed: orders.filter(o => o.status === 'completed').length,
                processing: orders.filter(o => o.status === 'processing').length,
                success: orders.filter(o => o.status === 'success').length
            };

            const prefix = type === 'fast' ? 'fast' : 'slow';
            document.getElementById(`${prefix}TotalOrders`).textContent = stats.total;
            document.getElementById(`${prefix}PendingOrders`).textContent = stats.pending;
            document.getElementById(`${prefix}CompletedOrders`).textContent = stats.completed;
            document.getElementById(`${prefix}ProcessingOrders`).textContent = stats.processing;
            document.getElementById(`${prefix}SuccessOrders`).textContent = stats.success;
        }

        function displayOrders(type, orders) {
            const container = document.getElementById(`${type}OrdersContent`);

            if (orders.length === 0) {
                container.innerHTML = `
                    <div class="empty">
                        <div class="empty-icon">📋</div>
                        <div>暂无订单数据</div>
                    </div>
                `;
                return;
            }

            const table = document.createElement('table');
            table.className = 'table';

            table.innerHTML = `
                <thead>
                    <tr>
                        <th>订单号</th>
                        <th>户号</th>
                        <th>类型</th>
                        <th>面额</th>
                        <th>实付</th>
                        <th>省</th>
                        <th>市</th>
                        <th>支付方式</th>
                        <th>状态</th>
                        <th>创建时间</th>
                        <th>操作</th>
                    </tr>
                </thead>
                <tbody>
                    ${orders.map(order => `
                        <tr>
                            <td>${order.orderNumber}</td>
                            <td>${order.accountNumber}</td>
                            <td>${order.typeName}</td>
                            <td>${order.faceAmount}元</td>
                            <td>${order.payAmount}元</td>
                              <td>${order.province}</td>
                              <td>${order.city}</td>
                            <td>${getPaymentMethod(order.paymentMethod)}</td>
                            <td><span class="status-badge status-${order.status}">${getStatusText(order.status)}</span></td>
                            <td>${formatTime(order.createTime)}</td>
                            <td>${getActionButton(order)}</td>
                        </tr>
                    `).join('')}
                </tbody>
            `;

            container.innerHTML = '';
            container.appendChild(table);
        }

        function getPaymentMethod(method) {
            const map = {
                'wechat': '微信支付',
                'alipay': '支付宝',
                'card': '银行卡'
            };
            return map[method] || method || '未选择';
        }

        function getStatusText(status) {
            const map = {
                'pending': '待支付',
                'processing': '充值中',
                'completed': '已付款',
                'success': '已完成',
                'failed': '充值失败'
            };
            return map[status] || status;
        }

        function formatTime(timestamp) {
            if (!timestamp) return '-';
            const date = new Date(timestamp);
            return date.toLocaleString('zh-CN', {
                year: 'numeric',
                month: '2-digit',
                day: '2-digit',
                hour: '2-digit',
                minute: '2-digit'
            });
        }

        function getActionButton(order) {
            if (order.status === 'completed') {
                return `
                    <div style="display: flex; gap: 8px;">
                        <button class="btn btn-primary" onclick="completeOrder('${order.orderNumber}')" style="padding: 6px 12px; font-size: 12px;">完成充值</button>
                        <button class="btn btn-danger" onclick="failOrder('${order.orderNumber}')" style="padding: 6px 12px; font-size: 12px;">充值失败</button>
                    </div>
                `;
            }
            return '-';
        }

        async function completeOrder(orderNumber) {
            if (!confirm('确认完成充值？')) {
                return;
            }

            try {
                const response = await fetch(`/api/orders/${orderNumber}/status`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ status: 'success' })
                });

                const result = await response.json();

                if (result.success) {
                    alert('充值完成！');
                    loadOrders();
                } else {
                    alert('操作失败：' + (result.message || '未知错误'));
                }
            } catch (error) {
                console.error('完成充值失败:', error);
                alert('操作失败，请稍后重试');
            }
        }

        async function failOrder(orderNumber) {
            const reason = prompt('请输入充值失败原因：');
            if (reason === null) {
                return;
            }

            if (!reason.trim()) {
                alert('请输入失败原因');
                return;
            }

            try {
                const response = await fetch(`/api/orders/${orderNumber}/status`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ status: 'failed', failReason: reason })
                });

                const result = await response.json();

                if (result.success) {
                    alert('已标记为充值失败！');
                    loadOrders();
                } else {
                    alert('操作失败：' + (result.message || '未知错误'));
                }
            } catch (error) {
                console.error('标记失败:', error);
                alert('操作失败，请稍后重试');
            }
        }

        async function searchOrders(type) {
            const keyword = document.getElementById(`${type}SearchInput`).value.trim();
            const status = document.getElementById(`${type}StatusFilter`).value;

            const container = document.getElementById(`${type}OrdersContent`);
            container.innerHTML = '<div class="loading">查询中...</div>';

            try {
                const params = new URLSearchParams();
                params.append('type', type);
                if (keyword) {
                    params.append('keyword', keyword);
                }
                if (status) {
                    params.append('status', status);
                }

                const url = `/api/orders?${params.toString()}`;
                const response = await fetch(url);
                const orders = await response.json();
                displayOrders(type, orders);
            } catch (error) {
                console.error('查询订单失败:', error);
                container.innerHTML = '<div class="empty">查询失败，请稍后重试</div>';
            }
        }

        async function resetSearch(type) {
            document.getElementById(`${type}SearchInput`).value = '';
            document.getElementById(`${type}StatusFilter`).value = '';

            const container = document.getElementById(`${type}OrdersContent`);
            container.innerHTML = '<div class="loading">加载中...</div>';

            try {
                const params = new URLSearchParams();
                params.append('type', type);
                const url = `/api/orders?${params.toString()}`;
                const response = await fetch(url);
                const orders = await response.json();
                displayOrders(type, orders);
            } catch (error) {
                console.error('加载订单失败:', error);
                container.innerHTML = '<div class="empty">加载失败，请刷新页面重试</div>';
            }
        }

        async function loadConfig() {
            try {
                const response = await fetch('/api/config');
                const config = await response.json();
                
                if (config) {
                    document.getElementById('fastDiscount').value = config.fastDiscount || '';
                    document.getElementById('slowDiscount').value = config.slowDiscount || '';
                }
            } catch (error) {
                console.error('加载配置失败:', error);
            }
        }

        async function saveConfig() {
            const config = {
                fastDiscount: parseFloat(document.getElementById('fastDiscount').value) || 1,
                slowDiscount: parseFloat(document.getElementById('slowDiscount').value) || 1
            };

            if (config.fastDiscount < 0 || config.fastDiscount > 1) {
                alert('快充折扣必须在0-1之间');
                return;
            }
            if (config.slowDiscount < 0 || config.slowDiscount > 1) {
                alert('慢充折扣必须在0-1之间');
                return;
            }

            try {
                const response = await fetch('/api/config', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(config)
                });

                const result = await response.json();

                if (result.success) {
                    alert('配置保存成功！');
                } else {
                    alert('保存失败：' + (result.message || '未知错误'));
                }
            } catch (error) {
                console.error('保存配置失败:', error);
                alert('保存失败，请稍后重试');
            }
        }

        document.getElementById('fastSearchInput').addEventListener('keyup', function(e) {
            if (e.key === 'Enter') {
                searchOrders('fast');
            }
        });

        document.getElementById('slowSearchInput').addEventListener('keyup', function(e) {
            if (e.key === 'Enter') {
                searchOrders('slow');
            }
        });

        loadAllOrders();
    </script>
</body>
</html>
