<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>后台管理系统 - 订单管理</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: #f5f7fa;
            color: #333;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px 30px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .header h1 {
            font-size: 24px;
            font-weight: 600;
        }

        .container {
            max-width: 1400px;
            margin: 30px auto;
            padding: 0 20px;
        }

        .search-bar {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            margin-bottom: 20px;
            display: flex;
            gap: 15px;
            align-items: center;
            flex-wrap: wrap;
        }

        .search-input {
            flex: 1;
            min-width: 200px;
            padding: 12px 16px;
            border: 1px solid #e1e8ed;
            border-radius: 6px;
            font-size: 14px;
            transition: all 0.3s;
        }

        .search-input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .filter-select {
            padding: 12px 16px;
            border: 1px solid #e1e8ed;
            border-radius: 6px;
            font-size: 14px;
            background: white;
            cursor: pointer;
            min-width: 120px;
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover {
            opacity: 0.9;
            transform: translateY(-1px);
        }

        .btn-secondary {
            background: #f5f7fa;
            color: #666;
            border: 1px solid #e1e8ed;
        }

        .btn-secondary:hover {
            background: #e8ecf1;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }

        .stat-card {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }

        .stat-label {
            font-size: 13px;
            color: #999;
            margin-bottom: 8px;
        }

        .stat-value {
            font-size: 28px;
            font-weight: 600;
            color: #333;
        }

        .orders-table {
            background: white;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            overflow: hidden;
        }

        .table-header {
            background: #f8f9fa;
            padding: 15px 20px;
            border-bottom: 1px solid #e1e8ed;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .table-title {
            font-size: 16px;
            font-weight: 600;
            color: #333;
        }

        .table {
            width: 100%;
            border-collapse: collapse;
        }

        .table th,
        .table td {
            padding: 15px 20px;
            text-align: left;
            border-bottom: 1px solid #e1e8ed;
        }

        .table th {
            background: #f8f9fa;
            font-weight: 600;
            color: #666;
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .table tbody tr:hover {
            background: #f8f9fa;
        }

        .status-badge {
            display: inline-block;
            padding: 6px 12px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 500;
        }

        .status-pending {
            background: #fff3cd;
            color: #856404;
        }

        .status-completed {
            background: #cce5ff;
            color: #004085;
        }

        .status-processing {
            background: #d1ecf1;
            color: #0c5460;
        }

        .status-success {
            background: #d4edda;
            color: #155724;
        }

        .status-failed {
            background: #f8d7da;
            color: #721c24;
        }

        .payment-method {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .payment-icon {
            font-size: 18px;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #999;
        }

        .empty {
            text-align: center;
            padding: 60px 20px;
            color: #999;
        }

        .empty-icon {
            font-size: 48px;
            margin-bottom: 16px;
            opacity: 0.3;
        }

        @media (max-width: 768px) {
            .search-bar {
                flex-direction: column;
                align-items: stretch;
            }

            .search-input,
            .filter-select,
            .btn {
                width: 100%;
            }

            .table {
                font-size: 12px;
            }

            .table th,
            .table td {
                padding: 10px;
            }

            .stats {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>后台管理系统 - 订单管理</h1>
    </div>

    <div class="container">
        <div class="stats">
            <div class="stat-card">
                <div class="stat-label">总订单数</div>
                <div class="stat-value" id="totalOrders">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">待支付</div>
                <div class="stat-value" id="pendingOrders">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">已付款</div>
                <div class="stat-value" id="completedOrders">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">充值中</div>
                <div class="stat-value" id="processingOrders">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">已完成</div>
                <div class="stat-value" id="successOrders">0</div>
            </div>
        </div>

        <div class="search-bar">
            <input type="text" class="search-input" id="searchInput" placeholder="搜索订单号或户号...">
            <select class="filter-select" id="statusFilter">
                <option value="">全部状态</option>
                <option value="pending">待支付</option>
                <option value="completed">已付款</option>
                <option value="processing">充值中</option>
                <option value="success">已完成</option>
                <option value="failed">充值失败</option>
            </select>
            <button class="btn btn-primary" onclick="searchOrders()">查询</button>
            <button class="btn btn-secondary" onclick="resetSearch()">重置</button>
        </div>

        <div class="orders-table">
            <div class="table-header">
                <div class="table-title">订单列表</div>
            </div>
            <div id="ordersContent">
                <div class="loading">加载中...</div>
            </div>
        </div>
    </div>

    <script>
        let allOrders = [];

        async function loadOrders() {
            try {
                const response = await fetch('/api/orders');
                allOrders = await response.json();
                updateStats();
                displayOrders(allOrders);
            } catch (error) {
                console.error('加载订单失败:', error);
                document.getElementById('ordersContent').innerHTML = '<div class="empty">加载失败，请刷新页面重试</div>';
            }
        }

        function updateStats() {
            const stats = {
                total: allOrders.length,
                pending: allOrders.filter(o => o.status === 'pending').length,
                completed: allOrders.filter(o => o.status === 'completed').length,
                processing: allOrders.filter(o => o.status === 'processing').length,
                success: allOrders.filter(o => o.status === 'success').length
            };

            document.getElementById('totalOrders').textContent = stats.total;
            document.getElementById('pendingOrders').textContent = stats.pending;
            document.getElementById('completedOrders').textContent = stats.completed;
            document.getElementById('processingOrders').textContent = stats.processing;
            document.getElementById('successOrders').textContent = stats.success;
        }

        function displayOrders(orders) {
            const container = document.getElementById('ordersContent');

            if (orders.length === 0) {
                container.innerHTML = `
                    <div class="empty">
                        <div class="empty-icon">📋</div>
                        <div>暂无订单数据</div>
                    </div>
                `;
                return;
            }

            const table = document.createElement('table');
            table.className = 'table';

            table.innerHTML = `
                <thead>
                    <tr>
                        <th>订单号</th>
                        <th>户号</th>
                        <th>类型</th>
                        <th>面额</th>
                        <th>实付</th>
                        <th>支付方式</th>
                        <th>状态</th>
                        <th>创建时间</th>
                        <th>操作</th>
                    </tr>
                </thead>
                <tbody>
                    ${orders.map(order => `
                        <tr>
                            <td>${order.orderNumber}</td>
                            <td>${order.accountNumber}</td>
                            <td>${order.typeName}</td>
                            <td>${order.faceAmount}元</td>
                            <td>${order.payAmount}元</td>
                            <td>${getPaymentMethod(order.paymentMethod)}</td>
                            <td><span class="status-badge status-${order.status}">${getStatusText(order.status)}</span></td>
                            <td>${formatTime(order.createTime)}</td>
                            <td>${getActionButton(order)}</td>
                        </tr>
                    `).join('')}
                </tbody>
            `;

            container.innerHTML = '';
            container.appendChild(table);
        }

        function getPaymentMethod(method) {
            const map = {
                'wechat': '微信支付',
                'alipay': '支付宝',
                'card': '银行卡'
            };
            return map[method] || method || '未选择';
        }

        function getStatusText(status) {
            const map = {
                'pending': '待支付',
                'processing': '充值中',
                'completed': '已付款',
                'success': '已完成',
                'failed': '充值失败'
            };
            return map[status] || status;
        }

        function formatTime(timestamp) {
            if (!timestamp) return '-';
            const date = new Date(timestamp);
            return date.toLocaleString('zh-CN', {
                year: 'numeric',
                month: '2-digit',
                day: '2-digit',
                hour: '2-digit',
                minute: '2-digit'
            });
        }

        function getActionButton(order) {
            if (order.status === 'completed') {
                return `<button class="btn btn-primary" onclick="completeOrder('${order.orderNumber}')" style="padding: 6px 12px; font-size: 12px;">完成充值</button>`;
            }
            return '-';
        }

        async function completeOrder(orderNumber) {
            if (!confirm('确认完成充值？')) {
                return;
            }

            try {
                const response = await fetch(`/api/orders/${orderNumber}/status`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ status: 'success' })
                });

                const result = await response.json();

                if (result.success) {
                    alert('充值完成！');
                    loadOrders();
                } else {
                    alert('操作失败：' + (result.message || '未知错误'));
                }
            } catch (error) {
                console.error('完成充值失败:', error);
                alert('操作失败，请稍后重试');
            }
        }

        function searchOrders() {
            const keyword = document.getElementById('searchInput').value.trim();
            const status = document.getElementById('statusFilter').value;

            let filtered = allOrders;

            if (keyword) {
                filtered = filtered.filter(order =>
                    order.orderNumber.includes(keyword) ||
                    order.accountNumber.includes(keyword)
                );
            }

            if (status) {
                filtered = filtered.filter(order => order.status === status);
            }

            displayOrders(filtered);
        }

        function resetSearch() {
            document.getElementById('searchInput').value = '';
            document.getElementById('statusFilter').value = '';
            displayOrders(allOrders);
        }

        document.getElementById('searchInput').addEventListener('keyup', function(e) {
            if (e.key === 'Enter') {
                searchOrders();
            }
        });

        loadOrders();
    </script>
</body>
</html>
